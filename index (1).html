<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語の読み上げ録音</title>
<style>
  :root {
    --navy: #14213D; --paper: #F7F5F0; --card: #FDFCF8; --line: #D6CEBE;
    --ink: #1E2638; --body: #3D4558; --muted: #626A7A;
    --blue: #2B6CB0; --blue-soft: #DCE7F3; --orange-ink: #9C4E13; --orange-soft: #F7E4CF;
    --ok: #2F7D4F; --warn: #B3261E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.7; }
  header { background: var(--navy); color: #F7F5F0; padding: 16px; }
  header h1 { margin: 0 auto; max-width: 760px; font-size: 20px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 16px 0; }
  h2 { font-size: 20px; margin: 0 0 12px; color: var(--navy); }
  h3 { font-size: 17px; margin: 0 0 4px; color: var(--navy); }
  p, li { font-size: 16px; color: var(--body); }
  ul { padding-left: 22px; margin: 6px 0; }
  label { font-size: 16px; min-width: 4.5em; }
  input[type=text], select { font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                             width: 100%; max-width: 320px; background: #fff; color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 10px 0; }
  button { font-size: 17px; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.rec { background: var(--orange-ink); border-color: var(--orange-ink); color: #fff; min-width: 180px; }
  button.link { background: none; border: none; color: var(--blue); padding: 8px 0; font-size: 15px; text-decoration: underline; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .instr { background: var(--orange-soft); color: var(--orange-ink); font-weight: 700; border-radius: 10px; padding: 10px 14px; margin: 0 0 8px; }
  .passage { font-family: Georgia, "Times New Roman", serif; font-size: 24px; line-height: 1.75; color: var(--ink);
             background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 12px 0; }
  .tips { background: var(--blue-soft); border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
  .tips li { font-size: 15px; margin: 4px 0; }
  .tips b { color: var(--navy); }
  .tips .small { margin: 6px 0 0; }
  .meter { height: 14px; background: #E7E2D7; border-radius: 7px; overflow: hidden; margin: 10px 0; }
  .meter > div { height: 100%; width: 0; background: var(--blue); transition: width .05s linear; }
  .dots { display: flex; gap: 8px; margin: 8px 0; }
  .dot { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 2px solid var(--line); display: flex;
         align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--muted); background: var(--card); }
  .dot.done { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .dot.now { outline: 3px solid var(--orange-ink); outline-offset: 2px; }
  .status { min-height: 1.7em; font-size: 15px; }
  .status.warn { color: var(--warn); font-weight: 700; }
  .status.ok { color: var(--ok); font-weight: 700; }
  .small { font-size: 14px; color: var(--muted); }
  audio { width: 100%; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>英語の読み上げ録音</h1></header>
<main>

<!-- 1. はじめ：ID と読み方を選んで始める -->
<section id="s-start" class="card">
  <h2>はじめに</h2>
  <p>英語の短い文章を 5 つ、声に出して読んで録音します（5〜10 分ほど）。静かな場所で、普通の速さで読んでください。</p>
  <div class="row">
    <label for="pid">ID</label>
    <input type="text" id="pid" placeholder="例：p01" autocomplete="off">
  </div>
  <div class="row">
    <label for="ses">読み方</label>
    <select id="ses"></select>
  </div>
  <p class="small" id="ses-note"></p>
  <p class="small" id="done-list"></p>
  <p class="status warn" id="start-msg"></p>
  <button class="primary" id="b-start">録音を始める</button>
  <p class="small" style="margin-top:12px">録音は卒業研究にだけ使い、公開しません。</p>
</section>

<!-- 2. 録音 -->
<section id="s-rec" class="card" hidden>
  <p class="instr" id="instr"></p>
  <div class="dots" id="dots"></div>
  <h2 id="p-head"></h2>
  <div class="passage" id="p-text"></div>
  <div class="tips" id="tips" hidden></div>
  <div class="meter"><div id="rec-meter"></div></div>
  <div class="row">
    <button class="rec" id="b-rec">● 録音開始</button>
    <button id="b-prev">◀ 前へ</button>
    <button id="b-next">次へ ▶</button>
  </div>
  <p class="status" id="rec-msg"></p>
  <audio id="player" controls hidden></audio>
  <p class="small">録音を始めて 1 秒待ってから読み始め、読み終わって 1 秒待ってから止めてください。読み間違えたら、その文章だけ録り直せます。上の丸い番号を押すと、その文章に移れます。<br>ページを閉じたり再読み込みしたりすると、録音が消えます。</p>
  <div class="row">
    <button class="primary" id="b-to-send" disabled>5 つ全部録音できたので、保存へ</button>
  </div>
  <button class="link" id="b-home">◀ 最初の画面に戻る（ID や読み方を変える）</button>
</section>

<!-- 3. 保存・送信 -->
<section id="s-send" class="card" hidden>
  <h2>保存</h2>
  <p id="send-intro"></p>
  <p class="small" id="zip-list"></p>
  <div class="row">
    <button class="primary" id="b-send">送信する</button>
    <button id="b-zip">ダウンロードする（ZIP）</button>
  </div>
  <p class="status" id="send-msg"></p>
  <div class="row">
    <button id="b-back">◀ 録音に戻る</button>
    <button id="b-other">別の読み方も録音する</button>
  </div>
</section>

</main>
<script>
"use strict";
// ================================================================
// 設定（研究者が書き換える所）
//   UPLOAD_URL：Google Apps Script をウェブアプリとして公開したときの URL（空なら、ダウンロードだけ）
//   UPLOAD_KEY：Apps Script の KEY と同じ合言葉
//   SEND_TO   ：ダウンロードした ZIP の送り先（参加者に見せる文）
// ================================================================
const UPLOAD_URL = "";
const UPLOAD_KEY = "";
const SEND_TO = "[送り先：林のメールアドレスや LINE など]";

// 読む文章（推論のノートブックの PASSAGES と同じ。どの現象の文章かは見せない）
const PASSAGES = [
  "Last Sunday, I took a short walk in the park with a friend from my English class. On the way home, we stopped at a small shop and got some bread.",
  "My brother had a problem at his job this morning. The meeting started late, and the data on his screen was all wrong, so it was a hard day at work.",
  "During the summer, many students come to our city to study English. In the evening, they sit by the river for hours and watch the little boats. My mother says it is the best place in town.",
  "I was waiting for the bus when I saw the news on my phone. A big storm was due that evening, and the wind was already getting strong. There was a good chance the trains would be late, so I asked a friend if I could stay at her place.",
  "My grandmother has a small garden with a narrow path to the gate. She knew the name of every flower, and each spring she plants something new. On hot days, she sits in the shade with a glass of cold tea and a box of cookies."
];

// 読み方。選択肢に出すのは最初の 3 つ（round1〜3 は、リンクに ?session=round1 などを付けたときだけ出る）
// キー（normal など）は、ZIP の中のフォルダ名になる（推論のノートブックと同じ名前）
const SESSIONS = {
  normal:   { label: "いつも通り",           instr: "いつも通りに読んでください" },
  us_style: { label: "アメリカ英語のつもり", instr: "アメリカ英語のつもりで読んでください" },
  uk_style: { label: "イギリス英語のつもり", instr: "イギリス英語のつもりで読んでください" },
  round1:   { label: "改善の実験 1回目",     instr: "1回目：いつも通りに読んでください" },
  round2:   { label: "改善の実験 2回目",     instr: "2回目：もう一度、いつも通りに読んでください" },
  round3:   { label: "改善の実験 3回目",     instr: "3回目：アドバイスを意識して読んでください" }
};
const MAIN_SESSIONS = ["normal", "us_style", "uk_style"];

// アメリカ風・イギリス風で読むときに意識すること（「いつも通り」のときは出さない）
const TIPS = {
  us_style: [
    ["母音の後ろの r（car, park, work, more）", "舌先を少し奥に引いて、r の響きを付ける"],
    ["母音にはさまれた t（city, little, water）", "舌先で軽くはじいて、「ラ」に近い音にする（city →「シリィ」、little →「リル」）"],
    ["a の音（last, class, ask, path）", "口を横に引いて「エァ」と言う（cat の a と同じ音）"],
    ["o の音（hot, job, not, got）", "唇を丸めずに、口を縦に大きく開けて「アー」と言う（hot →「ハート」に近い）"],
    ["new, students, during", "「ュ」を入れずに言う（new →「ヌー」、students →「ストゥーデンツ」）"]
  ],
  uk_style: [
    ["母音の後ろの r（car, park, work, more）", "r は発音しない。舌を動かさず、前の母音を伸ばすだけ（park →「パーク」）"],
    ["母音にはさまれた t（city, little, water）", "舌先を歯の裏に付けて、はっきり「t」と言う（city →「シティ」、little →「リトゥル」）"],
    ["a の音（last, class, ask, path）", "口を縦に開けて、長い「アー」と言う（father の a と同じ音）"],
    ["o の音（hot, job, not, got）", "唇を丸めて、短い「オ」と言う（hot →「ホット」）"],
    ["new, students, during", "「ュ」を入れて言う（new →「ニュー」、students →「ステューデンツ」）"]
  ]
};
const QUIET = 0.05, CLIP = 0.99, MAX_SEC = 90;
const NAME_RE = /^[A-Za-z0-9_-]{1,40}$/;

const $ = id => document.getElementById(id);
const setMsg = (el, text, kind) => { el.textContent = text; el.className = "status" + (kind ? " " + kind : ""); };

// ---- 録音の置き場所（ID と読み方ごとに分けて、メモリに持つ）----
const store = {};                       // "ID|読み方" → {0: {blob, url, sec, peak}, …}
let pid = "", session = "normal", n = 0, unsaved = false;
const keyOf = (id, ses) => id + "|" + ses;
const recs = () => (store[keyOf(pid, session)] = store[keyOf(pid, session)] || {});
const complete = k => !!store[k] && Object.keys(store[k]).length === PASSAGES.length;

// ---- 画面の切り替え（ブラウザの「戻る」「進む」でも、前の画面に戻れるようにする）----
function showScreen(id) {
  if (recording) cancelRec();
  for (const s of ["s-start", "s-rec", "s-send"]) $(s).hidden = (s !== id);
  if (id === "s-start") renderStart();
  if (id === "s-rec") render();
  if (id === "s-send") renderSend();
  window.scrollTo(0, 0);
}
function go(id) { history.pushState({ screen: id }, ""); showScreen(id); }
history.replaceState({ screen: "s-start" }, "");
window.addEventListener("popstate", e => {
  let id = (e.state && e.state.screen) || "s-start";
  if (id !== "s-start" && !ctx) id = "s-start";                       // マイクの準備前は、最初の画面だけ
  if (id === "s-send" && !complete(keyOf(pid, session))) id = "s-rec";
  showScreen(id);
});
window.addEventListener("beforeunload", e => { if (unsaved) { e.preventDefault(); e.returnValue = ""; } });

// ---- URL を読む（?id=p01 で ID を、?session=us_style などで読み方を、最初から選んでおける）----
const params = new URLSearchParams(location.search);
if (NAME_RE.test(params.get("id") || "")) $("pid").value = params.get("id");
const urlSes = SESSIONS[params.get("session")] ? params.get("session") : "normal";
for (const k of MAIN_SESSIONS.includes(urlSes) ? MAIN_SESSIONS : MAIN_SESSIONS.concat([urlSes])) {
  const o = document.createElement("option"); o.value = k; o.textContent = SESSIONS[k].label; $("ses").appendChild(o);
}
$("ses").value = urlSes;
$("pid").addEventListener("keydown", e => { if (e.key === "Enter") $("b-start").click(); });
$("pid").addEventListener("input", renderStart);
$("ses").addEventListener("change", renderStart);

function renderStart() {
  const s = $("ses").value;
  $("ses-note").textContent = TIPS[s] ? "録音の画面に、読むときに意識することが出ます。" : "";
  const id = $("pid").value.trim();
  const done = Object.keys(SESSIONS).filter(k => complete(keyOf(id, k))).map(k => SESSIONS[k].label);
  $("done-list").textContent = id && done.length ? "ID「" + id + "」で録音済みの読み方：" + done.join("、") : "";
}

// ---- マイク ----
let ctx = null, sr = 48000, level = 0, recording = false, chunks = [], recStart = 0;
async function initMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  sr = ctx.sampleRate;
  const source = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = e => {
    const x = e.inputBuffer.getChannelData(0);
    let m = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > m) m = a; }
    level = Math.max(m, level * 0.85);
    if (recording) {
      chunks.push(new Float32Array(x));
      if ((performance.now() - recStart) / 1000 > MAX_SEC) stopRec();
    }
  };
  source.connect(proc);
  proc.connect(ctx.destination);       // 出力は無音（ScriptProcessor を動かすためにつなぐだけ）
  (function draw() {
    $("rec-meter").style.width = Math.min(100, Math.round(level * 140)) + "%";
    requestAnimationFrame(draw);
  })();
}

$("b-start").addEventListener("click", async () => {
  const id = $("pid").value.trim();
  if (!NAME_RE.test(id)) { setMsg($("start-msg"), "ID は、半角の英数字で入力してください（例：p01）", "warn"); return; }
  setMsg($("start-msg"), "");
  $("b-start").disabled = true;
  try {
    if (!ctx) await initMic();
    if (ctx.state === "suspended") await ctx.resume();
    pid = id; session = $("ses").value;
    const r = recs();
    n = Math.max(0, PASSAGES.findIndex((_, i) => !r[i]));            // まだ録音していない最初の文章から
    go("s-rec");
    setMsg($("rec-msg"), "声を出すと、青いバーが動きます。動くのを確かめてから、録音を始めてください。");
  } catch (e) {
    setMsg($("start-msg"), "マイクを使えませんでした。ブラウザでマイクを「許可」して、もう一度押してください。（" + e.name + "）", "warn");
  }
  $("b-start").disabled = false;
});

// ---- 録音の画面 ----
function render() {
  $("instr").textContent = SESSIONS[session].instr + "（ID：" + pid + "）";
  $("p-head").textContent = "文章 " + (n + 1) + " ／ " + PASSAGES.length;
  $("p-text").textContent = PASSAGES[n];
  renderTips();
  const r = recs();
  const dots = $("dots"); dots.textContent = "";
  PASSAGES.forEach((_, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.className = "dot" + (r[i] ? " done" : "") + (i === n ? " now" : "");
    d.textContent = String(i + 1);
    d.title = "文章 " + (i + 1) + (r[i] ? "（録音済み）" : "");
    d.addEventListener("click", () => moveTo(i));
    dots.appendChild(d);
  });
  $("player").hidden = !r[n];
  if (r[n]) $("player").src = r[n].url; else $("player").removeAttribute("src");
  $("b-prev").disabled = n === 0;
  $("b-next").disabled = n === PASSAGES.length - 1;
  $("b-to-send").disabled = recording || !complete(keyOf(pid, session));
}
function renderTips() {
  const tips = TIPS[session], box = $("tips");
  box.hidden = !tips;
  if (!tips) return;
  box.textContent = "";
  const h = document.createElement("h3"); h.textContent = "読むときに意識すること"; box.appendChild(h);
  const ul = document.createElement("ul");
  for (const [what, how] of tips) {
    const li = document.createElement("li"), b = document.createElement("b");
    b.textContent = what + "："; li.appendChild(b); li.appendChild(document.createTextNode(how)); ul.appendChild(li);
  }
  box.appendChild(ul);
  const p = document.createElement("p"); p.className = "small";
  p.textContent = "全部できなくても大丈夫です。できる範囲で、意識して読んでください。";
  box.appendChild(p);
}

// 文章を移る（録音中に押したら、その録音は取り消して移る）
function moveTo(i) {
  if (i === n || i < 0 || i >= PASSAGES.length) return;
  const was = recording;
  if (recording) cancelRec();
  n = i;
  setMsg($("rec-msg"), was ? "録音中だったので、その録音は取り消しました" : "", was ? "warn" : "");
  render();
}

function startRec() {
  if (recs()[n] && !confirm("文章 " + (n + 1) + " は録音済みです。録り直しますか？")) return;
  chunks = []; recording = true; recStart = performance.now();
  $("b-rec").textContent = "■ 停止する";
  setMsg($("rec-msg"), "録音中…　1 秒待ってから読み始めてください");
  render();
}
function cancelRec() {
  recording = false; chunks = [];
  $("b-rec").textContent = "● 録音開始";
}
function stopRec() {
  if (!recording) return;
  recording = false;
  $("b-rec").textContent = "● 録音開始";
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const x = new Float32Array(len);
  let o = 0; for (const c of chunks) { x.set(c, o); o += c.length; }
  chunks = [];
  const sec = len / sr;
  if (sec < 1) { setMsg($("rec-msg"), "録音が短すぎたので、保存しませんでした", "warn"); render(); return; }
  let peak = 0; for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > peak) peak = a; }
  const r = recs();
  if (r[n]) URL.revokeObjectURL(r[n].url);
  const blob = encodeWav(x, sr);
  r[n] = { blob, url: URL.createObjectURL(blob), sec, peak };
  unsaved = true;
  if (peak < QUIET) setMsg($("rec-msg"), "音が小さすぎます。マイクに近づいて、録り直してください", "warn");
  else if (peak >= CLIP) setMsg($("rec-msg"), "音が割れています。マイクから少し離れて、録り直してください", "warn");
  else setMsg($("rec-msg"), "録音できました（" + sec.toFixed(1) + " 秒）。下で聞き直せます", "ok");
  render();
}
$("b-rec").addEventListener("click", () => recording ? stopRec() : startRec());
$("b-prev").addEventListener("click", () => moveTo(n - 1));
$("b-next").addEventListener("click", () => moveTo(n + 1));
$("b-to-send").addEventListener("click", () => go("s-send"));
$("b-home").addEventListener("click", () => go("s-start"));
$("b-back").addEventListener("click", () => go("s-rec"));
$("b-other").addEventListener("click", () => {
  const next = MAIN_SESSIONS.find(k => !complete(keyOf(pid, k)));   // まだ録音していない読み方を選んでおく
  if (next) $("ses").value = next;
  go("s-start");
});

// ---- 保存・送信の画面（同じ ID で、5 つ全部録音できた読み方を、まとめて保存する）----
const doneKeys = () => Object.keys(SESSIONS).map(k => keyOf(pid, k)).filter(complete);
function renderSend() {
  $("send-intro").textContent = UPLOAD_URL
    ? "「送信する」を押すと、録音が研究者に送られます。うまく送れなかったときは、「ダウンロードする」で保存したファイルを、" + SEND_TO + " に送ってください。"
    : "「ダウンロードする」を押すと、録音が 1 つのファイル（ZIP）にまとまって保存されます。そのファイルを、" + SEND_TO + " に送ってください。";
  $("b-send").hidden = !UPLOAD_URL;
  $("zip-list").textContent = "入る録音（ID：" + pid + "）：" + doneKeys().map(k => SESSIONS[k.split("|")[1]].label).join("、");
  setMsg($("send-msg"), "");
}

// ---- WAV（16bit・モノラル）----
function encodeWav(x, rate) {
  const buf = new ArrayBuffer(44 + x.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + x.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, x.length * 2, true);
  for (let i = 0, o = 44; i < x.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, x[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

// ---- ZIP（圧縮なし）：<ID>/<読み方>/1.wav〜5.wav ----
const CRC_TABLE = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {           // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, p) => a + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
}
$("b-zip").addEventListener("click", async () => {
  const keys = doneKeys(), files = [];
  for (const k of keys) {
    const ses = k.split("|")[1];
    for (let i = 0; i < PASSAGES.length; i++)
      files.push({ name: pid + "/" + ses + "/" + (i + 1) + ".wav", data: new Uint8Array(await store[k][i].blob.arrayBuffer()) });
  }
  const fname = keys.length === 1 ? pid + "_" + keys[0].split("|")[1] + ".zip" : pid + ".zip";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(files)); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  unsaved = false;
  setMsg($("send-msg"), "ダウンロードしました。このファイル（" + fname + "）を、" + SEND_TO + " に送ってください。ご協力ありがとうございました。", "ok");
});

// ---- 送信（Google Apps Script へ、1 ファイルずつ）----
function toBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
$("b-send").addEventListener("click", async () => {
  $("b-send").disabled = true;
  try {
    const keys = doneKeys(), total = keys.length * PASSAGES.length;
    let done = 0;
    for (const k of keys) {
      const ses = k.split("|")[1];
      for (let i = 0; i < PASSAGES.length; i++) {
        setMsg($("send-msg"), "送信中… " + (++done) + " ／ " + total);
        const body = JSON.stringify({ key: UPLOAD_KEY, id: pid, session: ses, passage: i + 1, sr, data: await toBase64(store[k][i].blob) });
        const res = await fetch(UPLOAD_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "送信できませんでした");
      }
    }
    unsaved = false;
    setMsg($("send-msg"), "送信が終わりました。ご協力ありがとうございました。このページは閉じて大丈夫です。", "ok");
  } catch (e) {
    setMsg($("send-msg"), "送信できませんでした（" + e.message + "）。「ダウンロードする」で保存したファイルを、" + SEND_TO + " に送ってください。", "warn");
  }
  $("b-send").disabled = false;
});

renderStart();
